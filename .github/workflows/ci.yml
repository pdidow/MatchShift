name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Detector evaluation against labelled synthetic scenarios
        run: dotnet run --no-build -c Release --project tools/MatchShift.Cli -- evaluate --matches 40

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MatchShift.Web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MatchShift.Web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx vite build --outDir dist

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t matchshift:ci .
