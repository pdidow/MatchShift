name: Deploy MatchShift Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MatchShift.Web/package-lock.json

      - name: Build demo exporter
        run: dotnet build tools/MatchShift.DemoExport/MatchShift.DemoExport.csproj -c Release

      - name: Generate static demo data
        run: dotnet run --project tools/MatchShift.DemoExport/MatchShift.DemoExport.csproj -c Release -- --output src/MatchShift.Web/public/demo

      - name: Install frontend dependencies
        working-directory: src/MatchShift.Web
        run: npm ci

      - name: Build GitHub Pages demo
        working-directory: src/MatchShift.Web
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/MatchShift.Web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4